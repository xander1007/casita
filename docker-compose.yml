name: sistemacasita

services:
  # Servicio de Backend (PHP 8.3 + Laravel)
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casita_app
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-casita_erp}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env (ver .env.example)}
    depends_on:
      - postgres

  # Base de Datos PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: casita_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-casita_erp}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env (ver .env.example)}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Gestor Web de Base de Datos
  pgadmin:
    image: dpage/pgadmin4
    container_name: casita_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@casita.pe}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Define PGADMIN_PASSWORD en el archivo .env (ver .env.example)}
    ports:
      - "5050:80"

volumes:
  postgres_data:
